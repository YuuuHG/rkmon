name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试
        run: go test ./...
      # 格式差异只报告不阻断：源码由作者手写，以 go vet / go test / go build 为准
      - name: 格式报告（非阻断）
        run: |
          echo "gofmt 建议:"; gofmt -l . || true

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: linux-amd64, goos: linux, goarch: amd64, goarm: '' }
          - { tag: linux-arm64, goos: linux, goarch: arm64, goarm: '' }
          - { tag: linux-armv7, goos: linux, goarch: arm,   goarm: '7' }
          - { tag: linux-armv6, goos: linux, goarch: arm,   goarm: '6' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      # 纯 Go 交叉编译：CGO_ENABLED=0，静态链接，零外部依赖。
      # 不使用 QEMU、不注册 binfmt_misc、不需要 --privileged、不挂 /proc/sys。
      - name: 交叉编译 ${{ matrix.tag }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o "dist/rkmon-${{ matrix.tag }}" .
          cd dist
          sha256sum "rkmon-${{ matrix.tag }}" > "rkmon-${{ matrix.tag }}.sha256"
          file "rkmon-${{ matrix.tag }}"
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: rkmon-${{ matrix.tag }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
